name: Auto-Update Trends Data

on:
  schedule:
    - cron: '23 * * * *' # Run at off-peak minute 23 every hour to avoid global :00 congestion
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger click

# Sets permissions of the GITHUB_TOKEN to allow pushing data updates
permissions:
  contents: write

# Prevent overlapping update runs
concurrency:
  group: "auto-update"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Requests
      run: pip install requests

    - name: Run Trend Fetcher Script
      run: |
        for i in 1 2 3; do
          if python fetch_trends.py; then
            exit 0
          fi
          echo "Attempt $i failed, retrying in 15 seconds..."
          sleep 15
        done
        echo "All 3 attempts failed."
        exit 1

    - name: Commit and Push Updated data.json
      run: |
        git config --global user.name 'timbibat'
        git config --global user.email 'timothybibat654@gmail.com'
        git add data.json data/data.json
        git commit -m "Auto-update trends data" || echo "No changes to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main